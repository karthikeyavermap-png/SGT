events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout  65;

    upstream yard_backend {
        server yard-service:8081;
    }

    upstream transport_backend {
        server transport-service:8082;
    }

    upstream commercial_backend {
        server commercial-service:8083;
    }

    upstream analytics_backend {
        server analytics-engine:8000;
    }

    upstream ticketing_backend {
        server ticketing-api:4000;
    }

    upstream web_frontend {
        server web-ui:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Cross-Origin Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Yard Service Route
        location /api/v1/yard/ {
            proxy_pass http://yard_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Transport Service Route
        location /api/v1/transport/ {
            proxy_pass http://transport_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Commercial Service Route
        location /api/v1/commercial/ {
            proxy_pass http://commercial_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Analytics & Report Engine Route
        location /api/v1/analytics/ {
            proxy_pass http://analytics_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Ticketing Management API Route
        location /api/ {
            proxy_pass http://ticketing_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health aggregation route
        location /gateway/health {
            default_type application/json;
            return 200 '{"status":"UP","gateway":"Nginx API Gateway","version":"1.0.0"}';
        }

        # Web UI
        location / {
            proxy_pass http://web_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

