version: '3.8'

services:
  # -------------------------------------------------------------
  # Event Broker (Apache Kafka KRaft Mode - No ZooKeeper needed)
  # -------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sgt-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Relational Database for SGT Microservices
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sgt-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - sgt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 1. Yard Microservice (Spring Boot)
  # -------------------------------------------------------------
  yard-service:
    build:
      context: ./services/yard-service
      dockerfile: Dockerfile
    container_name: sgt-yard-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yard_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # -------------------------------------------------------------
  # 2. Transport Microservice (Spring Boot)
  # -------------------------------------------------------------
  transport-service:
    build:
      context: ./services/transport-service
      dockerfile: Dockerfile
    container_name: sgt-transport-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transport_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # -------------------------------------------------------------
  # 3. Commercial Microservice (Spring Boot)
  # -------------------------------------------------------------
  commercial-service:
    build:
      context: ./services/commercial-service
      dockerfile: Dockerfile
    container_name: sgt-commercial-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commercial_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # -------------------------------------------------------------
  # 4. Analytics & Report Engine (Python / FastAPI)
  # -------------------------------------------------------------
  analytics-engine:
    build:
      context: ./services/analytics-engine
      dockerfile: Dockerfile
    container_name: sgt-analytics-engine
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started

  # -------------------------------------------------------------
  # 5. Core Ticketing API (Node / Fastify)
  # -------------------------------------------------------------
  ticketing-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sgt-ticketing-api
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "sgt-super-secret-jwt-key-2026"
      CORS_ORIGIN: "http://localhost:3000,http://localhost:8080"

  # -------------------------------------------------------------
  # 6. React / Next.js Web UI
  # -------------------------------------------------------------
  web-ui:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sgt-web-ui
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:8080"

  # -------------------------------------------------------------
  # 7. Unified API Gateway (Nginx Reverse Proxy)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: sgt-api-gateway
    ports:
      - "8080:80"
    depends_on:
      - yard-service
      - transport-service
      - commercial-service
      - analytics-engine
      - ticketing-api
      - web-ui

volumes:
  sgt-postgres-data:

